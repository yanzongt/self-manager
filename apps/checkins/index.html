<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f5f0">
<title>日常打卡 · Self Manager</title>
<style>
:root{color-scheme:light;--ink:#243c34;--muted:#758076;--line:#dedfd5;--green:#547451;--paper:#f6f5f0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:wait;opacity:.55}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #91ad80;outline-offset:3px}a{color:inherit}header,main,footer{width:min(1160px,calc(100% - 64px));margin:auto}header{height:90px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}header a{text-decoration:none;font-size:14px}.brand{font-weight:650}.mark{background:var(--ink);color:white;border-radius:9px;padding:3px 11px;margin-right:10px;font:24px Georgia}.date,.muted{color:var(--muted);font-size:13px}.intro{padding:45px 0 28px;display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--green)}h1{font-size:36px;letter-spacing:-1px;font-weight:550;margin:8px 0}p{margin:6px 0}h2{font-size:18px;font-weight:600;margin:0}h3{font-size:18px;font-weight:550;margin:12px 0;overflow-wrap:anywhere}.button{border:1px solid var(--line);border-radius:9px;background:#fffefa;padding:9px 16px;color:var(--ink)}.primary{background:var(--ink);border-color:var(--ink);color:#fff}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:0 0 32px}.stat{border:1px solid var(--line);border-radius:12px;padding:18px 23px;background:#eeeee5}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:27px;font-weight:550;margin-top:5px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 16px}.filters{display:flex;gap:5px;flex-wrap:wrap}.filters button{font-size:12px;padding:6px 13px}.filters button[aria-pressed=true]{background:#e2e9da;border-color:#9dac8d}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{padding:23px;border:1px solid var(--line);border-radius:14px;background:#fffefa;min-width:0}.badge{font-size:11px;color:var(--green);background:#edf1e7;padding:4px 9px;border-radius:5px}.badge.timer{color:#98744c;background:#f5edde}.card-top{display:flex;justify-content:space-between;align-items:center}.link{border:0;background:transparent;color:var(--muted);font-size:12px;padding:5px}.total{font-size:29px;font-weight:550;font-variant-numeric:tabular-nums;margin:10px 0 0}.card .action{width:100%;margin-top:20px;background:#eaf0e3;border-color:#ccd8be;color:#3e5b36;font-size:16px}.card .running{background:#f5e7d8;border-color:#dcc5a8;color:#8c582b}.detail{display:block;width:100%;margin-top:8px}.panel{border:1px solid var(--line);border-radius:14px;background:#fffefa;padding:24px;margin-top:28px}.chart{width:100%;height:240px;display:block}.chart-wrap{overflow-x:auto}.chart text{font-family:inherit;fill:#7b8478;font-size:11px}.legend{display:flex;gap:15px;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;background:#729064;margin-right:6px}.legend .amber{background:#c79c68}.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}.empty{text-align:center;padding:40px 20px;border:1px dashed #cdd3c3;border-radius:14px;color:var(--muted);grid-column:1/-1}.empty strong{display:block;color:var(--ink);font-weight:500;margin-bottom:6px}footer{padding:30px 0;font-size:11px;color:var(--muted)}#status{font-size:13px;min-height:22px;margin:4px 0 10px}#status.error{color:#ad442f}dialog{border:1px solid var(--line);border-radius:16px;padding:27px;width:min(500px,calc(100% - 30px));color:var(--ink);background:#fffefa}dialog::backdrop{background:#20372b55}label{display:block;font-size:13px;margin:20px 0 8px}input,select{border:1px solid #cdd2c6;border-radius:8px;background:white;color:var(--ink);padding:10px;max-width:100%}form input,form select{width:100%}.dialog-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:25px}.history{max-height:55vh;overflow:auto;padding:0;list-style:none}.history li{padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}.history small{display:block;color:var(--muted)}@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.chart-grid{grid-template-columns:1fr}}@media(max-width:600px){header,main,footer{width:calc(100% - 32px)}header{height:72px}.date{display:none}.intro{padding-top:26px}h1{font-size:29px}.intro>.button{white-space:nowrap;padding:9px 12px}.summary{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.cards{grid-template-columns:1fr}.section-head{flex-wrap:wrap}.panel{padding:17px}.chart{min-width:460px}.brand{font-size:13px}}
</style>
</head>
<body>
<header><div class="brand"><span class="mark">s</span>Self Manager / 日常打卡</div><a href="/">← 返回主页</a></header>
<main>
<section class="intro"><div><p class="eyebrow">SMALL STEPS, EVERY DAY</p><h1>每一次坚持，都算数。</h1><p class="muted">记录行动与投入，让日常的积累清晰可见。</p></div><button class="button primary" id="add" disabled>＋ 添加事项</button></section>
<div id="status" role="status" aria-live="polite">正在读取本机记录…</div>
<section class="summary" aria-label="今日概览"><div class="stat"><span>打卡事项</span><strong id="item-count">—</strong></div><div class="stat"><span>今日计次</span><strong id="today-count">—</strong></div><div class="stat"><span>今日投入</span><strong id="today-time">—</strong></div></section>
<div class="section-head"><h2>我的事项</h2><div class="filters" aria-label="事项筛选"><button class="button" data-filter="all" aria-pressed="true">全部</button><button class="button" data-filter="count" aria-pressed="false">按次数</button><button class="button" data-filter="timer" aria-pressed="false">按时间</button></div></div>
<section class="cards" id="cards" aria-label="打卡事项"></section>
<section class="panel"><div class="section-head" style="margin-top:0"><div><h2>每天的积累</h2><p class="muted">按本地日期统计，跨午夜的计时自动分摊。</p></div><div><select id="chart-item" aria-label="统计事项"><option value="all">所有事项</option></select> <select id="range" aria-label="统计天数"><option value="7">最近 7 天</option><option value="30">最近 30 天</option></select></div></div><div class="chart-grid"><div><div class="legend"><span><i></i>每日次数 · 次</span></div><div class="chart-wrap" id="count-chart"></div></div><div><div class="legend"><span><i class="amber"></i>每日时长 · 分钟</span></div><div class="chart-wrap" id="time-chart"></div></div></div></section>
</main>
<footer>记录保存在本机 data/checkins.json · 计时中的事项在刷新或关闭页面后仍会继续，返回后点击结束。</footer>
<dialog id="add-dialog"><form id="add-form"><h2>添加打卡事项</h2><label for="name">事项名称</label><input id="name" maxlength="80" placeholder="例如：喝水、阅读、练琴" required autocomplete="off"><label for="type">打卡类型</label><select id="type"><option value="count">按次数 · 每次点击 +1</option><option value="timer">按时间 · 点击开始 / 结束</option></select><p class="muted" style="margin-top:12px">每次打卡会保留时间记录，并计入每日图表。</p><div class="dialog-actions"><button type="button" class="button" id="cancel">取消</button><button class="button primary" type="submit">添加事项</button></div></form></dialog>
<dialog id="history-dialog"><div class="section-head" style="margin-top:0"><h2 id="history-title">打卡记录</h2><button class="button" id="close-history">关闭</button></div><p class="muted" id="history-summary"></p><ul class="history" id="history"></ul></dialog>
<script>
const TOKEN=/*SERVER_TOKEN*/null;
let state={items:[]},revision=null,busy=false,ready=false,filter='all';
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDay=t=>{const d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const duration=ms=>{const s=Math.floor(Math.max(0,ms)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}小时 ${m}分`:`${m}分 ${s%60}秒`};
const clock=ms=>{const s=Math.floor(Math.max(0,ms)/1000);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')};
const timestamp=t=>new Date(t).toLocaleString('zh-CN',{hour12:false});
function daily(items,now=Date.now()){
 const counts={},times={};
 for(const item of items){
  if(item.type==='count'){for(const r of item.records){const key=localDay(r.start);counts[key]=(counts[key]||0)+1;}continue;}
  const sessions=[...item.records];if(item.activeSince!=null)sessions.push({start:item.activeSince,end:now});
  for(const r of sessions){let start=r.start;while(start<r.end){const d=new Date(start);d.setHours(24,0,0,0);const end=Math.min(r.end,d.getTime());const key=localDay(start);times[key]=(times[key]||0)+end-start;start=end;}}
 }
 return {counts,times};
}
async function request(method,body){const res=await fetch('/api/checkins',{method,headers:{'X-PDCA-Token':TOKEN,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const data=await res.json();if(!res.ok)throw new Error(data.error||'保存失败');return data;}
function status(text,error=false){$('#status').textContent=text;$('#status').className=error?'error':'';}
async function load(){try{const saved=await request('GET');state=saved.data||{items:[]};revision=saved.revision;ready=true;status('已连接本机存储 · 每次打卡自动保存');render();}catch(e){status(`读取失败：${e.message}。请刷新重试。`,true);}}
async function mutate(change){if(busy||!ready)return false;busy=true;render();const next=structuredClone(state);try{change(next);const saved=await request('POST',{data:next,revision});state=next;revision=saved.revision;status('已保存 · '+new Date().toLocaleTimeString('zh-CN'));return true;}catch(e){ready=false;status(`保存失败：${e.message}。本次操作未确认，请刷新读取最新记录后重试。`,true);return false;}finally{busy=false;render();}}
function render(){const now=Date.now(),stats=daily(state.items,now),today=localDay(now);$('#item-count').textContent=state.items.length;$('#today-count').textContent=(stats.counts[today]||0)+' 次';$('#today-time').textContent=duration(stats.times[today]||0);$('#add').disabled=!ready||busy;
 const items=state.items.filter(i=>filter==='all'||i.type===filter);
 $('#cards').innerHTML=items.length?items.map(i=>{const timer=i.type==='timer',running=i.activeSince!=null,total=timer?i.records.reduce((s,r)=>s+r.end-r.start,0)+(running?Math.max(0,now-i.activeSince):0):i.records.length;const d=daily([i],now);return `<article class="card"><div class="card-top"><span class="badge ${timer?'timer':''}">${timer?'◷ 按时间':'＋ 按次数'}</span><span class="muted">${running?'● 计时中':`${i.records.length} 条记录`}</span></div><h3>${esc(i.name)}</h3><p class="total" data-total="${esc(i.id)}">${timer?duration(total):total+' 次'}</p><p class="muted" data-today="${esc(i.id)}">累计${timer?'投入':'打卡'} · 今日 ${timer?duration(d.times[today]||0):(d.counts[today]||0)+' 次'}</p>${running?`<p class="muted">本次 <strong data-clock="${esc(i.id)}">${clock(now-i.activeSince)}</strong> · ${esc(timestamp(i.activeSince))} 开始</p>`:'<p class="muted">'+(i.records.length?'最近：'+esc(timestamp(i.records.at(-1).end??i.records.at(-1).start)):'从今天的第一次开始')+'</p>'}<button class="button action ${running?'running':''}" data-action="check" data-id="${esc(i.id)}" ${busy||!ready?'disabled':''}>${timer?(running?'■ 结束计时':'▷ 开始计时'):'+1 打卡'}</button><button class="link detail" data-action="history" data-id="${esc(i.id)}">查看记录 ↗</button></article>`}).join(''):`<div class="empty"><strong>${state.items.length?'这个分类还没有事项':'为想坚持的事，留一个位置。'}</strong>点击「添加事项」，开始记录你的每一小步。</div>`;
 const selected=$('#chart-item').value;$('#chart-item').innerHTML='<option value="all">所有事项</option>'+state.items.map(i=>`<option value="${esc(i.id)}">${esc(i.name)}</option>`).join('');$('#chart-item').value=state.items.some(i=>i.id===selected)?selected:'all';renderCharts();}
function renderCharts(){const id=$('#chart-item').value,{counts,times}=daily(state.items.filter(i=>id==='all'||i.id===id));const days=[];for(let k=Number($('#range').value)-1;k>=0;k--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-k);days.push(localDay(d));}chart('#count-chart',days,counts,'次','#729064');chart('#time-chart',days,Object.fromEntries(Object.entries(times).map(([k,v])=>[k,v/60000])),'分钟','#c79c68');}
function chart(target,days,values,unit,color){const w=520,h=230,left=44,top=23,base=194,pw=w-left-12,max=Math.max(1,...days.map(d=>values[d]||0)),step=pw/days.length,bw=Math.min(32,step*.6);let svg=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="最近 ${days.length} 天每日${unit==='次'?'打卡次数':'打卡时长'}"><title>每日统计：${days.map(d=>d+' '+(values[d]||0).toFixed(unit==='次'?0:1)+unit).join('，')}</title>`;for(let n=0;n<=4;n++){const y=base-(base-top)*n/4;svg+=`<line x1="${left}" y1="${y}" x2="${w-10}" y2="${y}" stroke="#e8e9df"/><text x="${left-8}" y="${y+4}" text-anchor="end">${+(max*n/4).toFixed(1)}</text>`;}days.forEach((d,i)=>{const v=values[d]||0,bh=(base-top)*v/max,x=left+step*(i+.5);svg+=`<rect x="${x-bw/2}" y="${base-bh}" width="${bw}" height="${bh}" rx="3" fill="${color}"><title>${d}：${+v.toFixed(2)} ${unit}</title></rect>`;if(days.length===7||i%5===0||i===days.length-1)svg+=`<text x="${x}" y="216" text-anchor="middle">${d.slice(5).replace('-','/')}</text>`;if(v&&days.length===7)svg+=`<text x="${x}" y="${base-bh-7}" text-anchor="middle">${+v.toFixed(1)}</text>`;});if(!days.some(d=>values[d]))svg+='<text x="280" y="95" text-anchor="middle">这段时间还没有记录</text>';$(target).innerHTML=svg+'</svg>';}
$('#add').onclick=()=>{$('#add-form').reset();$('#add-dialog').showModal();$('#name').focus();};$('#cancel').onclick=()=>$('#add-dialog').close();
$('#add-form').onsubmit=async e=>{e.preventDefault();const name=$('#name').value.trim(),type=$('#type').value;if(!name){$('#name').setCustomValidity('请输入事项名称');$('#name').reportValidity();return;}$('#add-dialog').close();await mutate(s=>s.items.push({id:crypto.randomUUID(),name,type,records:[],activeSince:null}));};$('#name').oninput=()=>$('#name').setCustomValidity('');
$('#cards').onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b)return;const item=state.items.find(i=>i.id===b.dataset.id);if(b.dataset.action==='history'){showHistory(item);return;}await mutate(s=>{const i=s.items.find(i=>i.id===item.id),now=Date.now();if(i.type==='count')i.records.push({start:now});else if(i.activeSince==null)i.activeSince=now;else{if(now<i.activeSince)throw new Error('系统时间早于开始时间，请校准时间后重试');i.records.push({start:i.activeSince,end:now});i.activeSince=null;}});};
function showHistory(i){$('#history-title').textContent=i.name+' · 打卡记录';$('#history-summary').textContent=`共 ${i.records.length} 条已完成记录${i.activeSince!=null?' · 另有一次计时正在进行':''}`;$('#history').innerHTML=(i.activeSince!=null?`<li>计时中<small>开始：${esc(timestamp(i.activeSince))}</small></li>`:'')+[...i.records].reverse().map((r,k)=>`<li>${i.type==='count'?'第 '+(i.records.length-k)+' 次打卡':duration(r.end-r.start)}<small>${i.type==='count'?esc(timestamp(r.start)):'开始：'+esc(timestamp(r.start))+'<br>结束：'+esc(timestamp(r.end))}</small></li>`).join('')||'<li>还没有打卡记录。</li>';$('#history-dialog').showModal();}
$('#close-history').onclick=()=>$('#history-dialog').close();document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();});$('#chart-item').onchange=renderCharts;$('#range').onchange=renderCharts;
setInterval(()=>{
 if(!ready||busy)return;
 const now=Date.now(),stats=daily(state.items,now),today=localDay(now);
 $('#today-count').textContent=(stats.counts[today]||0)+' 次';
 $('#today-time').textContent=duration(stats.times[today]||0);
 for(const i of state.items.filter(i=>i.activeSince!=null)){
  const total=[...document.querySelectorAll('[data-total]')].find(n=>n.dataset.total===i.id),clockNode=[...document.querySelectorAll('[data-clock]')].find(n=>n.dataset.clock===i.id),todayNode=[...document.querySelectorAll('[data-today]')].find(n=>n.dataset.today===i.id);
  if(total)total.textContent=duration(i.records.reduce((s,r)=>s+r.end-r.start,0)+Math.max(0,now-i.activeSince));
  if(clockNode)clockNode.textContent=clock(now-i.activeSince);
  if(todayNode)todayNode.textContent='累计投入 · 今日 '+duration(daily([i],now).times[today]||0);
 }
 renderCharts();
},1000);load();
</script>
</body></html>
