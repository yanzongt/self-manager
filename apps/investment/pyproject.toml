[project]
name = "f-analysis"
version = "0.1.0"
description = "股票池与策略驱动的多资产回测、相关性和组合研究"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2.1,<3",
    "pandas>=2.2.3,<3",
    "yfinance>=0.2.54,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*", "f_analysis*"]

[tool.setuptools.package-data]
f_analysis = ["web_static/*"]
